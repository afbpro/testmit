name: Build and Update cPanel Repo

on:
  push:
    branches:
      - main

jobs:
  build-and-update-cpanel:
    runs-on: ubuntu-latest
    environment: cpanel
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Trigger cPanel VersionControl update
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}       # ej: https://tu-dominio.com:2083
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }} # API token con permisos
          CPANEL_USER: ${{ secrets.CPANEL_AUTH_USER }}       # usuario cPanel
          REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}    # ej: /home/usuario/repos/proyecto
          BRANCH: main                                  # rama a actualizar
        run: |
          echo "Updating repository on cPanel..."
          RESPONSE=$(curl -s -X GET \
            "$CPANEL_HOST/execute/VersionControl/update?repository_root=${REPO_ROOT}&branch=${BRANCH}" \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            -H "Accept: application/json")

          echo "Response from cPanel:"
          echo "$RESPONSE"
